name: Build LG webOS App
on: [push, workflow_dispatch]

jobs:
  build_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install LG Tools
        run: |
          npm install -g ares-cli
          # إضافة مسار الأدوات يدوياً للتأكد من التعرف عليها
          echo "$(npm bin -g)" >> $GITHUB_PATH

      - name: Build Package
        run: |
          mkdir -p output
          # البحث عن مكان appinfo.json
          APP_DIR=$(find . -name "appinfo.json" -exec dirname {} \; | head -n 1)
          # تشغيل الأمر باستخدام npx لضمان العثور عليه حتى لو لم يكن في المسار
          npx ares-package "$APP_DIR" -o ./output
          
      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: Movie-App-Package
          path: output/*.ipk
