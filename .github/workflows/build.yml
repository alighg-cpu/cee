name: Build LG webOS App
on: [push, workflow_dispatch]

jobs:
  build_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install LG Tools
        run: npm install -g @lg-webos/ares-cli

      - name: Build Package
        run: |
          mkdir -p output
          ares-package . -o ./output || ares-package ./cee -o ./output
          
      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: Movie-App-Package
          path: output/*.ipk
